name: Codey handoff

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  notify:
    if: github.event.label.name == 'codey'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Tell Grok Bot about the issue
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          WEBHOOK_URL: ${{ secrets.CODEY_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CODEY_WEBHOOK_KEY }}
        run: |
          jq -n --arg repo "$REPO" --argjson issue "$ISSUE" --arg url "$ISSUE_URL" \
            '{repo: $repo, issue: $issue, url: $url}' |
            curl -fsS -m 8 -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "X-Automation-Key: $WEBHOOK_KEY" \
              --data-binary @-
